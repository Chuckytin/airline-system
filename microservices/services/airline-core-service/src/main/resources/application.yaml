server:
  port: 5002

spring:
  application:
    name: airline-core-service

  datasource:
    url: jdbc:mysql://localhost:3306/airline_core_db
    username: root
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  aircraft:
    maintenance:
      alert-weeks: 2