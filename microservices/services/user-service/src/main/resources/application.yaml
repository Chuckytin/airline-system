server:
  port: 5001

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://localhost:3306/airline_user_db
    username: root
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:default-secret-key-for-dev-only-must-be-at-least-256-bits-long-please-change-in-production}
    expiration-ms: 86400000

  blacklist:
    cleanup:
      rate-ms: 3600000

  admin:
    email: ${ADMIN_EMAIL:admin@airline.com}
    password: ${ADMIN_PASSWORD:Admin1234!}
    full-name: ${ADMIN_FULL_NAME:System Administrator}